  twin_token_env: TWIN_TOKEN_GUARDIAN      # the guardian-role token the Twin owner gives us
frozen_requires_motion: true               # the Twin simulator holds calm values constant: a constant reading is only frozen when its peers or backup moved
seconds_per_tick: 1.0                      # confirmed by their docs (PLAN_AND_STEPS.md): 1 tick = 1000 ms
polling:
  mode: twin
  path: /api/v1/sensors
  interval_s: 1.0
containment:
  token_env: TWIN_TOKEN_GUARDIAN
  paths:
    quarantine_device: /api/v1/isolate
    isolate_sensor: /api/v1/isolate
    restore_device: /api/v1/restore
    rollback_reading: null      # the Twin has no rollback tool
adapters:
  partners:
    twin:
      timestamp_source: arrival   # order by seq/tick, stamp on arrival
      field_map: { sensor_id: device_id, zone_id: zone, type: sensor_type, reported_value: value }
      unit_conversions:
        water_level: { factor: 100, unit: cm, when_unit: m }   # water level is in cm (confirmed by the Twin team); kept only as a safety net for old logs in metres
